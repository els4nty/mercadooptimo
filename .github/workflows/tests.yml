name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Las pruebas de la LSTM se omiten aquí (PyTorch es pesado); se corren localmente con .[lstm]
      - run: pytest -q
