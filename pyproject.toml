[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercadooptimo"
version = "0.1.0"
description = "Optimización del presupuesto de compra de alimentos con predicción de precios y programación lineal entera"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "ortools>=9.8",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=7"]

[project.scripts]
mercadooptimo = "mercadooptimo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
